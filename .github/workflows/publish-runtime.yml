name: publish runtime image

# Builds the GGUF runtime (llama.cpp with the ROCmFPX fork, see runtime/) and
# publishes it to GitHub Container Registry.
#
# Why publish from here: a package pushed by hand from another machine is not
# connected to this repository, and GitHub then refuses to change its
# visibility through the API (`PATCH .../packages/container/...` answers 404).
# A package pushed by a workflow of this repository is connected to it, appears
# in the repository's Packages section, and inherits the repository's public
# visibility. That is why the image belongs here and not on a local machine.
#
# The build takes roughly half an hour: ROCm user space is most of the image.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish
        required: false
        default: llama-rocmfpx-1
  push:
    branches: [ main ]
    paths:
      - 'runtime/**'
      - '.github/workflows/publish-runtime.yml'

concurrency:
  group: publish-runtime-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR requires a lower-case image path, and this repository's name has
      # capitals, so the name is converted in one step and reused below.
      - name: Image name
        id: image
        run: |
          name="ghcr.io/${GITHUB_REPOSITORY,,}"
          tag="${{ inputs.tag }}"
          [ -n "$tag" ] || tag="llama-rocmfpx-1"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "path=$name:$tag" >> "$GITHUB_OUTPUT"
          echo "publishing $name:$tag"

      # The build needs about 10 GB for the ROCm packages and the image.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune -af || true
          df -h /

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: runtime
          push: true
          tags: ${{ steps.image.outputs.path }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          {
            echo "### Runtime image published"
            echo
            echo '```bash'
            echo "podman pull ${{ steps.image.outputs.path }}"
            echo "podman tag ${{ steps.image.outputs.path }} llama-rocmfpx:7.2.4"
            echo '```'
            echo
            echo "The tag \`llama-rocmfpx:7.2.4\` is the name the profile units use."
          } >> "$GITHUB_STEP_SUMMARY"
