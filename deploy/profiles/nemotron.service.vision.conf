# Vision drop-in for the nemotron profile (Nemotron-3.5-Super-VL-120B-A12B).
#
# Staged by deploy/setup-fedora.sh at
# ~/.config/superfast/vision/nemotron.service.conf, and installed ACTIVE into
# ~/.config/systemd/user/nemotron.service.d/override.conf by default
# (VISION_DEFAULT=1), so a fresh machine comes up with nemotron able to read
# images. VISION_DEFAULT=0 stages it inactive and keeps the profile text-only.
# `superfast-switch vision on` copies this file into the unit's .d/ and
# restarts it; `vision off` removes it and restarts.
#
# The projector (mmproj-BF16.gguf) sits in the same weights directory as the
# model, mounted read-only at /models, so no extra volume is needed — only the
# --mmproj argument. llama-server reads it at startup, which is why turning
# vision on or off restarts the profile (and drops the KV prefix cache).
#
# KEEP IN SYNC: this ExecStart mirrors deploy/profiles/nemotron.service. If
# you change the base unit's run command, change it here too. Re-running
# `ONLY=profiles bash deploy/setup-fedora.sh` refreshes both from the repo.
[Service]
# Clear the inherited ExecStart, then set the vision-enabled one.
ExecStart=
ExecStart=/usr/bin/podman run --name nemotron-server --rm -p 127.0.0.1:8731:8731 \
  --device /dev/kfd --device /dev/dri --group-add keep-groups \
  --security-opt seccomp=unconfined --ipc=host \
  -v /home/user/nemotron-models:/models:ro \
  localhost/superfast-vk:nemotron \
  -m /models/NVIDIA-Nemotron-3.5-Super-VL-120B-A12B-UD-Q3_K_XL-00001-of-00003.gguf \
  --mmproj /models/mmproj-BF16.gguf \
  --host 0.0.0.0 --port 8731 \
  -c 131072 --alias nemotron-3.5-super-vl-120b --jinja \
  --parallel 1 --timeout 0 \
  --chat-template-kwargs '{"enable_thinking": true}' \
  -ngl 99 -ub 256 \
  -md /models/mtp-Q8_0.gguf --spec-type draft-mtp --spec-draft-n-max 2 --spec-draft-ngl 99 \
  --temp 1.0 --top-p 0.95
