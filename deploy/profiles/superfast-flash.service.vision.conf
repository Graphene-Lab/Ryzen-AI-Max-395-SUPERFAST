# Vision drop-in for the flash profile (Qwen3.8-Flash-Next).
#
# Installed INACTIVE by deploy/setup-fedora.sh into
# ~/.config/superfast/vision/superfast-flash.service.conf. It is NOT in the
# unit's .d/ directory by default, so the profile runs text-only exactly as
# before. `superfast-switch vision on` copies this file to
# ~/.config/systemd/user/superfast-flash.service.d/override.conf and restarts
# the unit; `vision off` removes it and restarts.
#
# The vision tower file (qwen38-flash-next-vision.hgn) is already visible at
# /models/qwen38-flash-next-vision.hgn because the whole flash weights
# directory is mounted read-only at /models, so no extra volume is needed —
# only the two engine flags. The engine reads HALOGEN_VISION_TOWER once at
# startup, which is why turning vision on or off restarts the profile (and
# drops the prompt cache with it).
#
# KEEP IN SYNC: this ExecStart mirrors deploy/profiles/superfast-flash.service.
# If you change the base unit's run command, change it here too. Re-running
# `ONLY=profiles bash deploy/setup-fedora.sh` refreshes both from the repo.
#
# RISK (measure on the host): the flash engine's contiguous 2 MiB block
# allocator is tight at the shipped 786432-position pool. If loading the
# ~856 MiB tower makes the engine spin at startup without listening, lower
# HALOGEN_KV_POOL_POSITIONS (e.g. 655360) in BOTH this file and the base unit
# to leave room for the tower. `superfast-switch vision on` rolls back to
# text-only automatically if the engine does not come back healthy.
[Service]
# Clear the inherited ExecStart, then set the vision-enabled one.
ExecStart=
ExecStart=/usr/bin/podman run --name superfast-flash --rm -p 127.0.0.1:8731:8731 \
  --device /dev/kfd --device /dev/dri --group-add keep-groups \
  --security-opt seccomp=unconfined --ipc=host \
  -e HALOGEN_KV_SLOTS=4 \
  -e HALOGEN_CTX=262144 \
  -e HALOGEN_KV_POOL_POSITIONS=786432 \
  -e HALOGEN_KV_POOL_FIT=0 \
  -e HALOGEN_MAX_TOK=16384 \
  -e HALOGEN_CACHE_ENTRIES=32 \
  -e HALOGEN_QUEUE_TIMEOUT=3600 \
  -e HALOGEN_MAX_TOKENS_CAP=65536 \
  -e HALOGEN_VISION_TOWER=/models/qwen38-flash-next-vision.hgn \
  -e HALOGEN_VISION_MAX_PIXELS=3686400 \
  -v __FLASH_DIR__:/models:ro \
  -v __FLASH_DIR__/tokenizer:/tokenizer:ro \
  __FLASH_IMAGE__
