# Vision drop-in for the gemma profile (Gemma-4-26B-A4B, llama.cpp).
#
# Staged by deploy/setup-fedora.sh at
# ~/.config/superfast/vision/gemma.service.conf, and installed ACTIVE into
# ~/.config/systemd/user/gemma.service.d/override.conf by default
# (VISION_DEFAULT=1), so a fresh machine comes up with gemma able to read
# images. VISION_DEFAULT=0 stages it inactive and keeps the profile text-only.
# `superfast-switch vision on` copies this file into the unit's .d/ and
# restarts it; `vision off` removes it and restarts.
#
# The projector file (mmproj-BF16.gguf) is already visible at
# /models/mmproj-BF16.gguf because the whole gemma weights directory is
# mounted read-only at /models, so no extra volume is needed — only the
# --mmproj argument. llama-server reads it at startup, which is why turning
# vision on or off restarts the profile (and drops the KV prefix cache).
#
# KEEP IN SYNC: this ExecStart mirrors deploy/profiles/gemma.service. If you
# change the base unit's run command, change it here too. Re-running
# `ONLY=profiles bash deploy/setup-fedora.sh` refreshes both from the repo.
[Service]
# Clear the inherited ExecStart, then set the vision-enabled one.
ExecStart=
ExecStart=/usr/bin/podman run --name gemma-server --rm -p 127.0.0.1:8731:8731 \
  --device /dev/kfd --device /dev/dri --group-add keep-groups \
  --security-opt seccomp=unconfined --ipc=host \
  -v __GEMMA_DIR__:/models:ro \
  llama-rocmfpx:7.2.4 \
  -m /models/gemma-4-26B-A4B-it-Q4_0_ROCMFP4_COHERENT.gguf \
  --mmproj /models/mmproj-BF16.gguf \
  --host 0.0.0.0 --port 8731 \
  -c 262144 --alias gemma-4-26b-a4b --jinja \
  --parallel 1 --timeout 1800
