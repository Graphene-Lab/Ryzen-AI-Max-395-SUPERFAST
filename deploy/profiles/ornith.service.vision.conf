# Vision drop-in for the ornith profile (Ornith-1.5-35B-A3B, llama.cpp).
#
# Staged by deploy/setup-fedora.sh at
# ~/.config/superfast/vision/ornith.service.conf, and installed ACTIVE into
# ~/.config/systemd/user/ornith.service.d/override.conf by default
# (VISION_DEFAULT=1), so a fresh machine comes up with ornith able to read
# images. VISION_DEFAULT=0 stages it inactive and keeps the profile text-only.
# `superfast-switch vision on` copies this file into the unit's .d/ and
# restarts it; `vision off` removes it and restarts.
#
# The projector (mmproj-Ornith-1.5-35B-BF16.gguf) is already visible at
# /models/mmproj-Ornith-1.5-35B-BF16.gguf because the whole ornith weights
# directory is mounted read-only at /models, so no extra volume is needed —
# only the --mmproj argument. llama-server reads it at startup, which is why
# turning vision on or off restarts the profile (and drops the KV prefix
# cache).
#
# KEEP IN SYNC: this ExecStart mirrors deploy/profiles/ornith.service. If you
# change the base unit's run command, change it here too. Re-running
# `ONLY=profiles bash deploy/setup-fedora.sh` refreshes both from the repo.
[Service]
# Clear the inherited ExecStart, then set the vision-enabled one.
ExecStart=
ExecStart=/usr/bin/podman run --name ornith-server --rm -p 127.0.0.1:8731:8731 \
  --device /dev/kfd --device /dev/dri --group-add keep-groups \
  --security-opt seccomp=unconfined --ipc=host \
  -v __ORNITH_DIR__:/models:ro \
  localhost/superfast-vk:patch0012 \
  -m /models/Ornith-1.5-35B-A3B-ROCmFP4.gguf \
  --mmproj /models/mmproj-Ornith-1.5-35B-BF16.gguf \
  --host 0.0.0.0 --port 8731 \
  -c 262144 --alias ornith-1.5-35b-a3b --jinja \
  --parallel 1 --spec-type draft-mtp --spec-draft-n-max 2 --spec-draft-p-min 0.6 --reasoning off --spec-mtp-strict-qwen --timeout 1800
