# Vision drop-in for the inkling profile (Inkling-2-Mini, llama.cpp Vulkan).
#
# Staged by deploy/setup-fedora.sh at
# ~/.config/superfast/vision/inkling.service.conf, and installed ACTIVE into
# ~/.config/systemd/user/inkling.service.d/override.conf by default
# (VISION_DEFAULT=1), so a fresh machine comes up with inkling able to read
# images. VISION_DEFAULT=0 stages it inactive and keeps the profile text-only.
# `superfast-switch vision on` copies this file into the unit's .d/ and
# restarts it; `vision off` removes it and restarts.
#
# The projector (mmproj-Inkling-2-Mini-Q8_0.gguf) is already visible at
# /models/mmproj-Inkling-2-Mini-Q8_0.gguf because the whole inkling weights
# directory is mounted read-only at /models, so no extra volume is needed —
# only the --mmproj argument. llama-server reads it at startup, which is why
# turning vision on or off restarts the profile (and drops the KV prefix
# cache).
#
# KEEP IN SYNC: this ExecStart mirrors deploy/profiles/inkling.service. If you
# change the base unit's run command, change it here too. Re-running
# `ONLY=profiles bash deploy/setup-fedora.sh` refreshes both from the repo.
[Service]
# Clear the inherited ExecStart, then set the vision-enabled one.
ExecStart=
ExecStart=/usr/bin/podman run --name inkling-server --rm -p 127.0.0.1:8731:8731 \
  --device /dev/kfd --device /dev/dri --group-add keep-groups \
  --security-opt seccomp=unconfined --ipc=host \
  -v __INKLING_DIR__:/models:ro \
  ghcr.io/ggml-org/llama.cpp:server-vulkan \
  -m /models/Inkling-2-Mini-IQ4_NL.gguf \
  --mmproj /models/mmproj-Inkling-2-Mini-Q8_0.gguf \
  --host 0.0.0.0 --port 8731 \
  -c 524288 --alias inkling-2-mini --jinja \
  --parallel 1 --reasoning on --reasoning-effort low --timeout 0 \
  --temp 1.0 --top-p 1.0 --top-k 0 --min-p 0.0
